<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's the story?</title>
    <link rel="stylesheet" href="./styles/oasis.css">
</head>

<body>
    <header class="header">
        <img src="./images/logo.jpg" alt="Oasis Logo" height="auto" width="100%">
        <nav class="menu">
            <div class="mobile-menu-trigger">
                <img src="./images/menu.jpg" alt="menu icon" height="60px" width="auto">
            </div>
            <div class="mobile-menu-target">
                <div class="menu-item">Home</div>
                <div class="menu-item">Tour</div>
                <div class="menu-item">About</div>
                <div class="menu-item">Merchandise</div>
                <div class="menu-item">Gallery</div>
                <div class="menu-item">Contact</div>
            </div>
        </nav>
    </header>

    <main class="main">
        <div class="featured content">
            <img src="./images/live.jpg" alt="live show" width="100%" height="auto" />
            <div class="info">
                <h2>Oasis on Tour!</h2>
                <p>See the lads performing at a venue near you. Tickets on sale now</p>
            </div>
        </div>
        <div class="members">
            <div class="member liam">
                <p>Meet Liam Gallagher</p>
            </div>
            <div class="member noel">
                <p>Meet Noel Gallagher</p>
            </div>
        </div>
    </main>
</body>

</html>
